<!-- @dsCard group="Colors" viewport="700x150" subtitle="Where each color is used" name="Semantic Usage" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:150px;font-family:var(--font-body);padding:14px 16px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;font-size:13px">
  <div style="display:flex;align-items:center;gap:8px"><span style="width:16px;height:16px;background:var(--surface-page);border:1px solid #ddd;flex:none"></span>surface-page — slide background (default)</div>
  <div style="display:flex;align-items:center;gap:8px"><span style="width:16px;height:16px;background:var(--surface-accent);flex:none"></span>surface-accent — section-divider full-bleed fill</div>
  <div style="display:flex;align-items:center;gap:8px"><span style="width:16px;height:16px;background:var(--text-brand);flex:none"></span>text-brand — green text, links, eyebrows (green-700, 5.10:1 on white)</div>
  <div style="display:flex;align-items:center;gap:8px"><span style="width:16px;height:16px;background:var(--icon-stroke);flex:none"></span>icon-stroke — logo mark and icon strokes (green-600, non-text only)</div>
  <div style="display:flex;align-items:center;gap:8px"><span style="width:16px;height:16px;background:var(--text-body);flex:none"></span>text-body — paragraph copy on white</div>
</div>
