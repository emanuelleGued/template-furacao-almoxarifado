<link rel="stylesheet" href="../styles.css" />
<div
  style="
    width: 192px;
    height: 108px;
    background: #fff;
    border: 1px solid #ddd;
    position: relative;
    margin: 20px auto;
  "
>
  <div
    style="
      position: absolute;
      top: 9px;
      left: 12px;
      right: 12px;
      bottom: 9px;
      border: 1px dashed var(--green-600);
    "
  ></div>
</div>
<div
  style="text-align: center; font-family: var(--font-body); font-size: 12px; color: var(--gray-600)"
>
  120px × 90px margin on a 1920×1080 canvas
</div>
