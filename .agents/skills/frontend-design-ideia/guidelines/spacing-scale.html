<!-- @dsCard group="Spacing" viewport="700x150" subtitle="8px base scale" name="Spacing Scale" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:150px;display:flex;align-items:flex-end;gap:6px;padding:16px;box-sizing:border-box;font-family:var(--font-body)">
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:24px;height:var(--space-1);background:var(--green-600)"></div><span style="font-size:10px">8</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:24px;height:var(--space-2);background:var(--green-600)"></div><span style="font-size:10px">16</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:24px;height:var(--space-3);background:var(--green-600)"></div><span style="font-size:10px">24</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:24px;height:var(--space-4);background:var(--green-600)"></div><span style="font-size:10px">32</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:24px;height:var(--space-5);background:var(--green-600)"></div><span style="font-size:10px">48</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:24px;height:var(--space-6);background:var(--green-600)"></div><span style="font-size:10px">64</span></div>
</div>
