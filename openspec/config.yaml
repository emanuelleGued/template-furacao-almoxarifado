schema: spec-driven

context: |
  Antes de criar ou alterar artefatos, consulte os documentos aplicáveis:
  - docs/prds/minimundo.md: única fonte de verdade do domínio. Requisito, campo, papel de
    usuário ou regra que não esteja lá não existe. Não parafraseie o minimundo: cite a seção
    de origem e escreva apenas o que o artefato acrescenta.
  - docs/prds/PRD-00-indice.md: escopo da POC, telas, funcionalidades e os invariantes do
    domínio. Nenhuma change pode contrariar um invariante; cite-o pelo nome, não o reescreva.
    A tabela de funcionalidades define o que está na POC; ampliar escopo é decisão explícita.
  - docs/prds/: comportamento esperado das telas afetadas. Um PRD por tela, uma tela por rota.
  - docs/AGENTS.md: organização da documentação, pré-requisitos e ordem de leitura.
  - docs/prds/AGENTS.md: organização interna dos PRDs.
  - docs/Constituicao/: decisões de stack, arquitetura e convenções. Documento sem decisão
    registrada significa decisão não tomada: proponha e confirme, não presuma.

  Ambiguidade que bloqueia o trabalho vira pergunta ao responsável. Ambiguidade que não
  bloqueia vira dúvida em aberto, nomeada pela funcionalidade afetada, nunca suposição
  implícita.

rules:
  proposal:
    - Manter foco em por que a mudanca existe.
    - Nao abrir a change sem objetivo e escopo claros (Definition of Ready).
    - Explicitar o que fica fora de escopo (nao-objetivos).
    - Escrever em portugues.
    - Nao usar a skill/modo caveman; comunicar de forma normal e completa.
  design:
    - Explicar decisoes tecnicas e trade-offs.
    - Cada decisao deve registrar o racional e a alternativa rejeitada.
    - Cada risco deve vir com mitigacao, nao so o reconhecimento.
    - Registrar duvidas em aberto de forma nomeada, nao como suposicao implicita.
    - Escrever em portugues.
    - Nao usar a skill/modo caveman; comunicar de forma normal e completa.
  specs:
    - Ficar no nivel da intencao (o que/por que); nao descer a nome de variavel ou detalhe de implementacao.
    - Cada requisito deve ter cenario(s) cobrindo caminho feliz e bordas/erro.
    - Cenarios devem usar exatamente #### (formato WHEN/THEN); 3 hashtags falha silenciosamente.
    - Escrever em portugues.
    - Nao usar a skill/modo caveman; comunicar de forma normal e completa.
  tasks:
    - Quebrar trabalho em passos atomicos e verificaveis.
    - Ordenar por dependencia.
    - Incluir validacao como fase final explicita (rodar testes/lint, conferir criterios).
    - Nao marcar task como concluida sem evidencia (teste, execucao ou trecho conferido).
    - Escrever em portugues.
    - Nao usar a skill/modo caveman; comunicar de forma normal e completa.
